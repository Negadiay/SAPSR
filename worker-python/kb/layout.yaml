# Параметры извлечения текста и разметки блоков. Это не правила оформления:
# от них зависит, что считается основным текстом, колонтитулом, заголовком.
# Единицы — пункты PDF (1 мм ≈ 2,835 пт), страница A4 — 595 × 842 пт.

hidden_text:
  # Символ считается белым, если все компоненты цвета не меньше порога (0 — чёрный, 1 — белый).
  white_threshold: 0.95
  # Символы мельче — «микроскопический» текст.
  min_size_pt: 2.0
  # На сколько символ может выйти за край страницы, прежде чем считаться невидимым.
  page_overflow_pt: 1.0
  # Сколько непробельных скрытых символов на странице достаточно для замечания.
  min_chars: 3

zones:
  # Основной текст — между этими отметками (поле 20 мм − 5,3 мм и 27 мм + 5,3 мм от краёв).
  body_top_pt: 42
  body_bottom_pt: 780
  # Номер страницы ищется ниже этой отметки и правее этой.
  page_number_top_pt: 740
  page_number_x_min_pt: 200
  # Цифры номера дальше друг от друга — разные надписи.
  page_number_char_gap_pt: 3
  page_number_max: 9999

main_font:
  # Титул и оглавление не определяют основной шрифт: считаем со страницы
  start_page: 3
  # Меньше символов основного текста на странице — берём все символы страницы.
  min_body_chars: 5

labeler:
  # Символы с разницей «top» меньше — одна строка.
  line_y_tolerance_pt: 3
  # Края текста — процентили начал и концов строк основного текста (левый — нижний, правый — верхний).
  text_edge_percentile: 10
  heading_max_chars: 200
  # Строка крупнее основного шрифта во столько раз — признак заголовка.
  heading_size_ratio: 1.05
  # Сколько признаков заголовка нужно у строки с номером раздела: полужирный, крупнее
  # основного, прописные, отбивка сверху (см. labeling.py).
  heading_min_score: 1
  centered_tolerance_pt: 40
  # Красная строка: первая строка абзаца правее левого края текста на столько.
  paragraph_indent_min_pt: 15
  paragraph_indent_max_pt: 60
  # Строка-продолжение начинается у левого края текста ± столько.
  continuation_tolerance_pt: 8
  # Шаг строк (от верха до верха) больше (размер шрифта × коэффициент) — новый блок.
  # Полуторный интервал Word даёт ≈1,72, LaTeX с \linespread — ≈1,2.
  line_pitch_max_ratio: 2.0
  # Красная строка документа берётся из самого документа (самый частый отступ);
  # отклонение от неё больше этого — уже не красная строка.
  # (первая буква сдвигает край на несколько пунктов: «E» и «В» начинаются по-разному).
  paragraph_indent_tolerance_pt: 8
  # Строка оглавления: перед номером страницы пропуск не меньше или отточие.
  toc_number_gap_pt: 30
  toc_leader_min_dots: 4
  # Формула: доля символов математических шрифтов в строке.
  formula_math_font_share: 0.3
  formula_math_fonts: [cmmi, cmsy, cmex, msam, msbm, math, symbol, rsfs, stix, eufm]
  list_markers: ["–", "—", "-", "•", "·", "▪", "◦", "*"]

context:
  # Фрагмент текста вокруг найденного места в замечании (поле context старого формата).
  before: 40
  after: 60
  max_len: 120
