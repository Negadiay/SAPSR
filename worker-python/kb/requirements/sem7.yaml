# Требования 7-го семестра к гибридной интеллектуальной системе (план, З5, шаг 1).
#
# ЧЕРНОВИК: формулировки взяты из раздела 0 планов группы («Что требует 7-й семестр»),
# где кратко пересказана методичка «Требования к системе.pdf». Пункты методички (clause)
# и этапы опроцентовки (stages) проставлены по календарю плана — сверить с самой методичкой.
#
# stages — на каких опроцентовках требование проверяется (на остальных — «не применимо на этом этапе»);
# expected_in — части записки, где ожидается свидетельство (kb/concepts.yaml, doc_parts);
# keywords — слова для поиска фрагментов-кандидатов (BM25), вместе с title и text;
# sufficient — что считается достаточным свидетельством; эту формулировку видит модель.

id: sem7
title: Требования к системе, 7 семестр
semester: 7
draft: true

requirements:
  - id: REQ7-NEURAL-ROLE
    title: Нейросетевой компонент участвует в решении
    text: Нейросетевой (статистический) компонент реально участвует в цепочке решения задачи, а не только упомянут.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [нейросеть, нейросетевой, модель, языковая, классификатор, обучение, разметка, извлечение]
    sufficient: Описано, на каком шаге решения работает нейросетевая модель, что она получает на вход и что выдаёт, и как её результат используется дальше.
    source: { doc: "Требования к системе, 7 семестр", note: "сверить пункт с методичкой" }

  - id: REQ7-SYMBOLIC-EXPLAIN
    title: Символьный компонент обеспечивает объяснимость
    text: Символьный компонент (база знаний, правила, механизм вывода) обеспечивает проверяемость и объяснимость итогового решения.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [база, знаний, правила, продукционные, вывод, объяснение, объяснимость, онтология, решатель]
    sufficient: Описано, какие знания и правила хранятся в системе, как механизм вывода принимает итоговое решение и как это решение объясняется пользователю.
    source: { doc: "Требования к системе, 7 семестр", note: "сверить пункт с методичкой" }

  - id: REQ7-INTEGRATION
    title: Точки интеграции описаны явно
    text: Точки интеграции компонентов описаны явно — что, в каком формате и на каком шаге передаётся между нейросетевой и символьной частью.
    stages: [2, 3]
    expected_in: [part.architecture]
    keywords: [интеграция, взаимодействие, формат, передаётся, JSON, схема, этап, шаг, интерфейс, компонент]
    sufficient: Для каждой передачи данных между компонентами указано, что передаётся, в каком формате и на каком шаге.
    source: { doc: "Требования к системе, 7 семестр", note: "сверить пункт с методичкой" }

  - id: REQ7-MISMATCH
    title: Обработка рассогласований
    text: Предусмотрена обработка рассогласований — неуверенный ответ модели, отсутствие знаний в базе, противоречие между правилом и моделью.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [рассогласование, противоречие, уверенность, неуверенный, порог, отсутствие, конфликт, приоритет]
    sufficient: Описано, что система делает при неуверенном ответе модели, при отсутствии знаний в базе и при противоречии правила и модели.
    source: { doc: "Требования к системе, 7 семестр", note: "сверить пункт с методичкой" }

  - id: REQ7-REPLACEABLE
    title: Независимая замена компонентов
    text: Компоненты системы заменяются независимо друг от друга.
    stages: [2, 3]
    expected_in: [part.architecture]
    keywords: [замена, заменить, независимо, интерфейс, модульность, модуль, подключаемый, параметр]
    sufficient: Показано, что модель, база знаний и решатель можно заменить по отдельности, не меняя остальные части (например, общий интерфейс компонента).
    source: { doc: "Требования к системе, 7 семестр", note: "сверить пункт с методичкой" }

  - id: REQ7-TESTING
    title: Методика тестирования
    text: Есть методика тестирования — компонентные, интеграционные и сквозные тесты в трёх группах (типичные, граничные, отрицательные), результаты сведены в таблицы.
    stages: [3]
    expected_in: [part.testing, part.implementation]
    keywords: [тест, тестирование, сквозные, интеграционные, компонентные, граничные, отрицательные, типичные, таблица, результаты]
    sufficient: Описаны уровни тестирования, группы сценариев и приведены таблицы с ожидаемыми и фактическими результатами.
    source: { doc: "Требования к системе, 7 семестр", note: "сверить пункт с методичкой" }

  - id: REQ7-EFFICIENCY
    title: Оценка эффективности
    text: Есть оценка эффективности (время отклика, нагрузка модели) и, желательно, сравнение гибридного варианта с чисто символьным и чисто нейросетевым.
    stages: [3]
    expected_in: [part.testing, part.implementation]
    keywords: [время, отклика, производительность, нагрузка, замер, секунд, сравнение, символьный, нейросетевой, гибридный]
    sufficient: Приведены замеры времени и нагрузки модели; желательно — сравнение трёх вариантов системы.
    source: { doc: "Требования к системе, 7 семестр", note: "сверить пункт с методичкой" }
