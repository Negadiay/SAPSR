# Требования 7-го семестра к гибридной интеллектуальной системе (план, З5, шаг 1).
#
# Сверено 23.10.2026 с методичкой: раздел 16 «Требования к курсовым работам в 7 учебном
# семестре» (с. 57–63, «Требования к системе.pdf»). Пунктов с номерами там нет, поэтому
# clause — подраздел и страница. Формулировки text — по тексту методички, сокращённо.
#
# Этапы — по разделу 12 «Общие требования … для прохождения опроцентовки» (с. 32–35):
#   1-я (5-я неделя)  — введение и половина раздела 1: требований к системе здесь ещё нет;
#   2-я (9-я неделя)  — раздел 1 закончен, раздел 2 на 70–80 %: методы, сценарии, архитектура,
#                       алгоритмы ИИ-компонентов, форматы данных — требования к архитектуре;
#   3-я (13-я неделя) — раздел 3 на 80–90 % с результатами тестирования — тестирование и эффективность.
#
# stages — на каких опроцентовках требование проверяется (на остальных — «не применимо на этом этапе»);
# expected_in — части записки, где ожидается свидетельство (kb/concepts.yaml, doc_parts);
# keywords — слова для поиска фрагментов-кандидатов (BM25), вместе с title и text;
# sufficient — что считается достаточным свидетельством; эту формулировку видит модель.

id: sem7
title: Требования к системе, 7 семестр
semester: 7
draft: false

requirements:
  - id: REQ7-HYBRID-JUSTIFIED
    title: Обоснован гибридный подход
    text: Обосновано, почему для этой предметной области и этого класса задач нужен гибридный подход — в чём недостаточны символьные методы и в чём недостаточны статистические по отдельности.
    stages: [2, 3]
    expected_in: [part.intro, part.analysis]
    keywords: [гибридный, гибридного, подход, обоснование, недостаточно, недостатки, ограничения, символьные, статистические, нейросетевые, сочетание]
    sufficient: Названо, чего не хватает чисто символьному и чисто статистическому решению для этих задач и почему их сочетание это устраняет.
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к предметной области и задачам, с. 58" }

  - id: REQ7-NEURAL-ROLE
    title: Нейросетевой компонент участвует в решении
    text: Статистический или нейросетевой компонент реально задействован в цепочке решения задачи (извлечение признаков, ранжирование, классификация, генерация текста, поиск релевантных знаний), а не подключён формально.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [нейросеть, нейросетевой, модель, языковая, классификатор, обучение, разметка, извлечение, ранжирование, эмбеддинги]
    sufficient: Описано, на каком шаге решения работает нейросетевая модель, что она получает на вход и что выдаёт, и как её результат используется дальше.
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к функциональности и интеграции компонентов, с. 59" }

  - id: REQ7-SYMBOLIC-EXPLAIN
    title: Символьный компонент обеспечивает объяснимость
    text: Символьный компонент (база знаний, правила, логический вывод) обеспечивает проверяемость, структурированность и, где применимо, объяснимость итогового решения.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [база, знаний, правила, продукционные, вывод, объяснение, объяснимость, проверяемость, онтология, решатель]
    sufficient: Описано, какие знания и правила хранятся в системе, как механизм вывода принимает итоговое решение и как это решение объясняется пользователю.
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к функциональности и интеграции компонентов, с. 59" }

  - id: REQ7-INTEGRATION
    title: Точки интеграции описаны явно
    text: Явно описаны точки интеграции символьных и статистических компонентов — что передаётся из одного компонента в другой, в каком формате и на каком этапе обработки запроса.
    stages: [2, 3]
    expected_in: [part.architecture]
    keywords: [интеграция, взаимодействие, формат, передаётся, JSON, схема, этап, шаг, интерфейс, компонент]
    sufficient: Для каждой передачи данных между компонентами указано, что передаётся, в каком формате и на каком шаге.
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к архитектуре гибридной интеллектуальной системы, с. 58" }

  - id: REQ7-COMBINATION
    title: Обоснована стратегия комбинирования
    text: Обоснована стратегия комбинирования методов — последовательная, параллельная, каскадная, с арбитражем результатов, с обратной связью и т. п.
    stages: [2, 3]
    expected_in: [part.architecture]
    keywords: [стратегия, комбинирование, комбинирования, каскад, каскадная, последовательная, параллельная, арбитраж, обратная, связь]
    sufficient: Названа стратегия комбинирования нейросетевой и символьной частей и объяснено, почему выбрана именно она.
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к архитектуре гибридной интеллектуальной системы, с. 58" }

  - id: REQ7-MISMATCH
    title: Обработка рассогласований
    text: Предусмотрены механизмы обработки рассогласования компонентов — неуверенный результат статистической модели, отсутствие релевантных знаний в базе, противоречие между выводом решателя и результатом модели.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [рассогласование, противоречие, уверенность, неуверенный, порог, отсутствие, конфликт, приоритет]
    sufficient: Описано, что система делает при неуверенном ответе модели, при отсутствии знаний в базе и при противоречии правила и модели.
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к качеству: по устойчивости и надёжности, с. 60" }

  - id: REQ7-REPLACEABLE
    title: Независимая замена компонентов
    text: Архитектура позволяет независимо обновлять или заменять отдельные компоненты — базу знаний, решатель, статистическую модель, интерфейс — без критической перестройки всей системы.
    stages: [2, 3]
    expected_in: [part.architecture]
    keywords: [замена, заменить, обновление, независимо, интерфейс, модульность, модуль, подключаемый, параметр]
    sufficient: Показано, что модель, база знаний и решатель можно заменить по отдельности, не меняя остальные части (например, общий интерфейс компонента).
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к архитектуре гибридной интеллектуальной системы, с. 58" }

  - id: REQ7-TESTING
    title: Методика тестирования
    text: Есть методика тестирования — отдельные тесты ключевых компонентов, интеграционные и сквозные; группы типичных, граничных и отрицательных случаев; зафиксирована процедура выполнения; результаты сведены в таблицы.
    stages: [3]
    expected_in: [part.testing, part.implementation]
    keywords: [тест, тестирование, сквозные, интеграционные, компонентные, граничные, отрицательные, типичные, таблица, результаты]
    sufficient: Описаны уровни тестирования, группы сценариев и порядок запуска, приведены таблицы с ожидаемыми и фактическими результатами.
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к тестированию гибридной системы и оценке качества, с. 60–61" }

  - id: REQ7-EFFICIENCY
    title: Оценка эффективности
    text: Проведена оценка эффективности — время отклика на типовой запрос, нагрузка статистического компонента, влияние объёма базы знаний на производительность; рекомендуется сравнение с чисто символьным и чисто статистическим вариантами.
    stages: [3]
    expected_in: [part.testing, part.implementation]
    keywords: [время, отклика, производительность, нагрузка, замер, секунд, сравнение, символьный, нейросетевой, гибридный]
    sufficient: Приведены замеры времени и нагрузки модели; желательно — сравнение трёх вариантов системы.
    source: { doc: "Требования к системе, 7 семестр", clause: "Требования к качеству: по эффективности, с. 60" }
