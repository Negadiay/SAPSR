# Требования 5-го семестра к решателю задач интеллектуальной системы (решение 16).
#
# Сверено 15.11.2026 с методичкой: раздел 14 «Требования к курсовым проектам в 5 учебном
# семестре» (с. 43–49). Пунктов с номерами там нет, поэтому clause — подраздел и страница.
# Формулировки text — по тексту методички, сокращённо.
#
# Этапы — по разделу 12 «Общие требования … для прохождения опроцентовки» (с. 32–35):
#   предметная область, задачи и обоснование метода — этапы 1–3;
#   алгоритм и архитектура решателя (проектирование) — этапы 2 и 3;
#   тестирование, эффективность и анализ результатов — этап 3.
#
# Поля требования — как в sem7.yaml: stages, expected_in, keywords, sufficient.

id: sem5
title: Требования к решателю задач, 5 семестр
semester: 5
draft: false

requirements:
  - id: REQ5-DOMAIN-KB
    title: Описаны предметная область и база знаний
    text: Предметная область и база знаний, которую использует решатель задач, чётко описаны во введении и аналитическом разделе — со ссылкой на курсовой проект 4-го семестра либо самостоятельно.
    stages: [1, 2, 3]
    expected_in: [part.intro, part.analysis]
    keywords: [предметная, область, база, знаний, описание, сущности, используется, решатель]
    sufficient: Названа предметная область и описано, какая база знаний используется решателем и что в ней хранится.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к предметной области и задачам, с. 43" }

  - id: REQ5-TASK-CLASSES
    title: Сформулированы классы решаемых задач
    text: Чётко сформулированы классы задач, которые решает разрабатываемый решатель (диагностика, классификация, выбор, конфигурирование, планирование, объяснение, прогнозирование); решатель привязан к конкретной предметной области.
    stages: [1, 2, 3]
    expected_in: [part.intro, part.analysis, part.requirements]
    keywords: [класс, задач, диагностика, классификация, выбор, планирование, прогнозирование, решает, решатель]
    sufficient: Названо, какие классы задач решает решатель и для какой предметной области.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к предметной области и задачам, с. 43–44" }

  - id: REQ5-METHOD-JUSTIFIED
    title: Обоснован метод решения задач
    text: Выбран и обоснован метод решения задач (логический вывод, продукционные правила, поиск по графу состояний, эвристический поиск, CSP, машинное обучение, LLM-подход) с точки зрения пригодности для заявленного класса задач.
    stages: [1, 2, 3]
    expected_in: [part.analysis, part.architecture]
    keywords: [метод, решения, выбор, обоснование, логический, вывод, продукционные, правила, поиск, эвристический, пригодность]
    sufficient: Назван метод решения задач и объяснено, почему он подходит для заявленного класса задач.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к методам и алгоритмам решения задач, с. 44" }

  - id: REQ5-ALGORITHM
    title: Описан алгоритм решения
    text: Алгоритм решения задачи описан псевдокодом, схемой или формально — входные данные, шаги вывода или поиска, критерии останова, выходные данные; показано, какие элементы базы знаний используются на шагах алгоритма.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [алгоритм, шаги, псевдокод, схема, входные, выходные, данные, останов, вывода, поиска]
    sufficient: Приведены шаги алгоритма с входными и выходными данными и указано, какие знания из базы используются в ходе решения.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к методам и алгоритмам решения задач, с. 44" }

  - id: REQ5-ARCHITECTURE
    title: Решатель выделен в модуль с описанными компонентами
    text: Решатель задач выделен в самостоятельный программный модуль с чётко определённым интерфейсом взаимодействия с базой знаний и будущим пользовательским интерфейсом; выделены его основные компоненты с описанием зон ответственности.
    stages: [2, 3]
    expected_in: [part.architecture]
    keywords: [архитектура, модуль, компоненты, интерфейс, взаимодействие, машина, вывода, загрузка, ответственность]
    sufficient: Перечислены компоненты решателя, для каждого сказано, за что он отвечает, и описано, как решатель обращается к базе знаний.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к архитектуре решателя задач, с. 44" }

  - id: REQ5-KB-SEPARATE
    title: Знания отделены от кода решателя
    text: Факты и правила предметной области не размещены жёстко в коде алгоритма — знания хранятся в базе знаний и извлекаются из неё; базу знаний можно заменить или расширить без переписывания логики решателя.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [база, знаний, хранятся, извлекаются, отделены, замена, расширение, код, правила, факты]
    sufficient: Сказано, что правила и факты хранятся отдельно от кода решателя и загружаются из базы знаний.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к архитектуре решателя задач, с. 45" }

  - id: REQ5-TRACE-DEMO
    title: Показаны сценарии решения с трассировкой
    text: Продемонстрированы типовые сценарии решения задач с пошаговым протоколом работы алгоритма (трассировкой вывода или поиска) — решатель реально работает хотя бы для базового набора сценариев.
    stages: [2, 3]
    expected_in: [part.implementation, part.testing]
    keywords: [сценарий, пример, трассировка, протокол, шаги, вывода, решение, демонстрация, цепочка]
    sufficient: Приведён пример решения задачи, в котором видно, какие шаги выполнил решатель и к какому результату пришёл.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к функциональности решателя, с. 45" }

  - id: REQ5-TEST-GROUPS
    title: Тесты разделены на группы
    text: Разработан тестовый набор задач с ожидаемыми результатами, разделённый как минимум на типичные корректные, граничные и отрицательные случаи (задачи без решения, некорректные или противоречивые входные данные).
    stages: [3]
    expected_in: [part.testing]
    keywords: [тест, тестовый, набор, типичные, граничные, отрицательные, ожидаемый, результат, некорректные]
    sufficient: Описан набор тестов, в котором названы типичные, граничные и отрицательные случаи и для тестов указан ожидаемый результат.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к тестированию решателя задач и оценке качества, с. 46" }

  - id: REQ5-EFFICIENCY
    title: Оценена эффективность решателя
    text: Проведена оценка вычислительной эффективности решателя — время решения задачи, сложность алгоритма, поведение при увеличении объёма базы знаний или сложности запроса.
    stages: [3]
    expected_in: [part.testing]
    keywords: [эффективность, время, решения, сложность, объём, замеры, производительность, быстродействие]
    sufficient: Приведены замеры времени решения или оценка сложности алгоритма и сказано, как они меняются с ростом базы знаний или запроса.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к качеству решателя задач, с. 46" }

  - id: REQ5-TEST-RESULTS
    title: Результаты тестирования проанализированы
    text: Результаты тестирования оформлены в таблицах (идентификатор теста, сценарий, ожидаемый и фактический результат, отметка о прохождении), проведён их анализ и описаны критерии приемлемости качества решателя.
    stages: [3]
    expected_in: [part.testing, part.conclusion]
    keywords: [результаты, тестирования, таблица, фактический, пройден, анализ, критерии, приемлемости, доля, ошибки]
    sufficient: Приведены результаты тестов с отметкой о прохождении и сделан вывод, какие задачи решатель решает успешно и где есть ошибки.
    source: { doc: "Требования к курсовым проектам, 5 семестр", clause: "Требования к тестированию решателя задач и оценке качества, с. 47" }
