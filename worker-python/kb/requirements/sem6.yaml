# Требования 6-го семестра к интерфейсу интеллектуальной системы (решение 16).
#
# Сверено 15.11.2026 с методичкой: раздел 15 «Требования к курсовым проектам в 6 учебном
# семестре» (с. 50–56). Пунктов с номерами там нет, поэтому clause — подраздел и страница.
# Формулировки text — по тексту методички, сокращённо.
#
# Этапы — по разделу 12 «Общие требования … для прохождения опроцентовки» (с. 32–35):
#   участники взаимодействия, сценарии и анализ существующих решений — этапы 1–3;
#   требования к интерфейсу, его архитектура и спецификации (проектирование) — этапы 2 и 3;
#   прототип и результаты его тестирования — этап 3.
#
# Поля требования — как в sem7.yaml: stages, expected_in, keywords, sufficient.

id: sem6
title: Требования к интерфейсу, 6 семестр
semester: 6
draft: false

requirements:
  - id: REQ6-ACTORS
    title: Определены участники взаимодействия
    text: Явно определены участники взаимодействия (конечные пользователи, внешние системы, устройства, подсистемы) и описаны роли и цели каждого — какие задачи он решает, какую информацию получает и передаёт.
    stages: [1, 2, 3]
    expected_in: [part.intro, part.analysis, part.requirements]
    keywords: [пользователь, пользователи, участники, роли, цели, задачи, внешние, системы, взаимодействие]
    sufficient: Названы участники взаимодействия и для каждого сказано, какие задачи он решает через интерфейс.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к постановке задачи и пользователям, с. 50" }

  - id: REQ6-SCENARIOS
    title: Сформулированы сценарии использования
    text: Сформулированы сценарии использования (варианты использования, пользовательские пути, сценарии обмена сообщениями), показывающие последовательность действий пользователя и реакции системы.
    stages: [1, 2, 3]
    expected_in: [part.analysis, part.requirements, part.architecture]
    keywords: [сценарий, сценарии, использования, вариант, действия, пользователя, реакция, последовательность, шаги]
    sufficient: Описан хотя бы один сценарий — последовательность действий пользователя и ответов системы.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к постановке задачи и пользователям, с. 50" }

  - id: REQ6-ANALOGS
    title: Проанализированы существующие решения
    text: Проведён анализ существующих решений — интерфейсов схожих систем — с выделением их достоинств и недостатков.
    stages: [1, 2, 3]
    expected_in: [part.analysis]
    keywords: [аналоги, существующие, решения, сравнение, достоинства, недостатки, обзор, схожих, систем]
    sufficient: Названы существующие решения и для них указаны достоинства и недостатки.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к пояснительной записке, с. 54" }

  - id: REQ6-REQUIREMENTS
    title: Выделены требования к интерфейсу
    text: Выделены функциональные и нефункциональные требования к интерфейсу (удобство, скорость выполнения типичных задач, понятность терминологии, доступность, устройства и среды использования).
    stages: [2, 3]
    expected_in: [part.requirements, part.analysis]
    keywords: [требования, функциональные, нефункциональные, удобство, скорость, доступность, понятность, интерфейсу]
    sufficient: Перечислены функциональные требования к интерфейсу и хотя бы одно нефункциональное.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к постановке задачи и пользователям, с. 50" }

  - id: REQ6-USABILITY
    title: Описаны учтённые принципы удобства
    text: Явно описано, какие принципы удобства использования (понятность, эффективность, обучаемость, предсказуемость, устойчивость к ошибкам) учитывались при проектировании интерфейса и как они в нём реализованы.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [удобство, usability, понятность, обучаемость, предсказуемость, ошибки, подсказки, навигация, принципы]
    sufficient: Названы принципы удобства использования и показано, какими решениями в интерфейсе они обеспечены.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к качеству взаимодействия (usability), с. 51–52" }

  - id: REQ6-INTELLIGENT
    title: Описаны интеллектуальные функции интерфейса
    text: Интерфейс содержит элементы интеллектуального поведения (помощь пользователю, адаптация к контексту, объяснение результатов), и степень интеллектуальности чётко описана; формальное наличие элемента без логики не засчитывается.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [подсказки, рекомендации, объяснение, адаптация, автодополнение, интеллектуальная, помощь, контекст]
    sufficient: Названа хотя бы одна интеллектуальная функция интерфейса и описано, по какой логике она работает.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к интеллектуальности интерфейса, с. 52–53" }

  - id: REQ6-ARCHITECTURE
    title: Описано место интерфейса в архитектуре системы
    text: Описано место интерфейса в общей архитектуре интеллектуальной системы (связи с базой знаний, решателем задач, внешними сервисами) и указано, какие данные и в каком виде передаются через интерфейс.
    stages: [2, 3]
    expected_in: [part.architecture]
    keywords: [архитектура, интерфейс, связи, база, знаний, решатель, данные, формат, передаются, протокол, модули]
    sufficient: Показано, с какими компонентами системы связан интерфейс и какие данные и в каком формате через него передаются.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к архитектуре интерфейса, с. 53" }

  - id: REQ6-FAILURES
    title: Описана обработка аварийных ситуаций
    text: Описана обработка типовых аварийных ситуаций — отказ подсистемы, отсутствие связи, некорректные данные, недоступность устройства.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [ошибки, отказ, сбой, недоступность, некорректные, данные, связь, обработка, сообщение]
    sufficient: Названа хотя бы одна аварийная ситуация и описано, что при ней видит пользователь или как ведёт себя интерфейс.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к архитектуре интерфейса, с. 53" }

  - id: REQ6-PROTOTYPE-TESTED
    title: Прототип реализован и протестирован
    text: Реализован прототип, выполняющий ключевые сценарии взаимодействия, и приведены результаты его тестирования — сценарии, найденные проблемы, ограничения.
    stages: [3]
    expected_in: [part.implementation, part.testing]
    keywords: [прототип, реализован, тестирование, сценарии, проблемы, ограничения, результаты, проверка]
    sufficient: Сказано, какие сценарии выполняет прототип, и приведены результаты его тестирования с найденными проблемами или ограничениями.
    source: { doc: "Требования к курсовым проектам, 6 семестр", clause: "Требования к пояснительной записке, с. 54" }
