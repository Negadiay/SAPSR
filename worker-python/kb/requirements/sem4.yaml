# Требования 4-го семестра к базе знаний интеллектуальной системы (решение 16).
#
# Сверено 15.11.2026 с методичкой: раздел 13 «Требования к курсовым проектам в 4 учебном
# семестре» (с. 36–42). Пунктов с номерами там нет, поэтому clause — подраздел и страница.
# Формулировки text — по тексту методички, сокращённо.
#
# Этапы — по разделу 12 «Общие требования … для прохождения опроцентовки» (с. 32–35):
#   предметная область, задачи и обоснование выбора — этапы 1–3;
#   структура и представление знаний (проектирование) — этапы 2 и 3;
#   тестирование и анализ результатов — этап 3.
#
# Поля требования — как в sem7.yaml: stages, expected_in, keywords, sufficient.

id: sem4
title: Требования к базе знаний, 4 семестр
semester: 4
draft: false

requirements:
  - id: REQ4-DOMAIN
    title: Предметная область очерчена
    text: Предметная область чётко очерчена и описана во введении и аналитическом разделе — названы её основные сущности, связи между ними и типичные задачи.
    stages: [1, 2, 3]
    expected_in: [part.intro, part.analysis]
    keywords: [предметная, область, сущности, связи, понятия, объекты, задачи, описание]
    sufficient: Названа предметная область, перечислены её основные сущности и связи между ними и приведены типичные задачи этой области.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к предметной области и задачам, с. 36" }

  - id: REQ4-TASK-TYPES
    title: Названы типы задач базы знаний
    text: Сформулированы конкретные типы задач, для решения которых предназначена база знаний (диагностика, классификация, выбор, конфигурирование, планирование, объяснение), и показано, как структура базы знаний их поддерживает.
    stages: [1, 2, 3]
    expected_in: [part.intro, part.analysis, part.requirements]
    keywords: [задачи, класс, диагностика, классификация, выбор, планирование, объяснение, предназначена, поддерживает]
    sufficient: Названы типы задач, которые решаются с помощью базы знаний, и для них указано, какие части базы знаний используются.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к предметной области и задачам, с. 36" }

  - id: REQ4-SCENARIOS
    title: Выделены сценарии использования
    text: Выделены реалистичные сценарии использования, показывающие, как пользователь или внешний модуль системы обращается к базе знаний.
    stages: [1, 2, 3]
    expected_in: [part.analysis, part.requirements, part.architecture]
    keywords: [сценарий, сценарии, использования, пользователь, запрос, обращение, модуль]
    sufficient: Описан хотя бы один сценарий — кто обращается к базе знаний, с каким запросом и что получает в ответ.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к предметной области и задачам, с. 36" }

  - id: REQ4-STRUCTURE
    title: Знания организованы в явную структуру
    text: Знания организованы в явную структуру (иерархии классов, онтологические слои, модули, тематические разделы), а связи между сущностями (часть–целое, тип–подтип, причинно-следственные и другие) явно описаны.
    stages: [2, 3]
    expected_in: [part.architecture, part.implementation]
    keywords: [структура, иерархия, классы, модули, слои, разделы, связи, отношения, подтип, часть, целое]
    sufficient: Описано, на какие части (классы, модули, разделы) разделена база знаний и какими видами связей соединены её сущности.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к видам и структуре знаний, с. 36–37" }

  - id: REQ4-LANGUAGE-JUSTIFIED
    title: Обоснован выбор формального языка
    text: Обоснован выбор формального языка или структуры представления знаний — с точки зрения пригодности для заявленных задач, выразительной мощности и удобства последующей обработки (вывода, поиска, проверки целостности).
    stages: [2, 3]
    expected_in: [part.analysis, part.architecture]
    keywords: [формальный, язык, представление, знаний, выбор, обоснование, предикатов, продукционные, онтология, семантическая, сеть, выразительность]
    sufficient: Назван язык или формат представления знаний и объяснено, почему он подходит для заявленных задач и последующей обработки.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к формальному языку и представлению знаний, с. 37" }

  - id: REQ4-APPLICABILITY
    title: Указаны границы применимости базы знаний
    text: Явно выделены границы применимости базы знаний — для каких классов задач и входных данных она предназначена, а для каких нет.
    stages: [2, 3]
    expected_in: [part.analysis, part.architecture, part.testing, part.conclusion]
    keywords: [границы, применимости, ограничения, предназначена, покрытие, охватывает, допущения]
    sufficient: Сказано, какие задачи или данные база знаний охватывает и какие остаются за её пределами.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к качеству базы знаний, с. 38" }

  - id: REQ4-USAGE-DEMO
    title: Показано использование базы знаний
    text: Реализован или интегрирован базовый механизм обращения к базе знаний (поиск по запросу, проверка условий, применение правил) и продемонстрированы типовые сценарии с пояснением, какие элементы базы знаний при этом задействуются.
    stages: [2, 3]
    expected_in: [part.implementation, part.testing]
    keywords: [запрос, поиск, применение, правил, механизм, демонстрация, пример, сценарий, прототип, задействуются]
    sufficient: Описан способ обращения к базе знаний и приведён пример решения задачи с указанием использованных фактов или правил.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к функциональности и демонстрации работы, с. 39" }

  - id: REQ4-TEST-GROUPS
    title: Тесты разделены на группы
    text: Разработан тестовый набор вопросов или сценариев с ожидаемыми ответами, разделённый как минимум на типичные корректные, граничные и отрицательные случаи.
    stages: [3]
    expected_in: [part.testing]
    keywords: [тест, тестовый, набор, типичные, граничные, отрицательные, ожидаемый, результат, сценарии]
    sufficient: Описан набор тестов, в котором названы типичные, граничные и отрицательные случаи и для тестов указан ожидаемый результат.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к тестированию базы знаний и оценке её качества, с. 39–40" }

  - id: REQ4-TEST-RESULTS
    title: Результаты тестирования проанализированы
    text: Результаты тестирования оформлены в таблицах (идентификатор теста, сценарий, ожидаемый и фактический результат, отметка о прохождении), проведён их анализ и описаны критерии приемлемости качества базы знаний.
    stages: [3]
    expected_in: [part.testing, part.conclusion]
    keywords: [результаты, тестирования, таблица, фактический, пройден, анализ, критерии, приемлемости, доля, ошибки]
    sufficient: Приведены результаты тестов с отметкой о прохождении и сделан вывод, какие задачи база знаний решает успешно и где есть ошибки или неполнота.
    source: { doc: "Требования к курсовым проектам, 4 семестр", clause: "Требования к тестированию базы знаний и оценке её качества, с. 40" }
