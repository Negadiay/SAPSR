# Список использованных источников, перечисления, ссылки на рисунки и таблицы.

- id: REF-COUNT-CRITICAL
  title: Количество источников (минимум)
  category: structure
  source: { doc: "Норма перенесена из прежнего анализатора", note: "документ и пункт уточнить" }
  severity: critical
  blocking: true
  check: references.count
  params: { fewer_than: 5, at_least: 0, recommended: 10 }
  message: "Источников {count} — меньше {fewer_than}."
  expected: "Не менее {recommended} источников."
  found: "Найдено источников: {count}."
  fix: "Добавьте источники, каждый — отдельной записью."

- id: REF-COUNT-MIN
  title: Количество источников (рекомендуемое)
  category: structure
  source: { doc: "Норма перенесена из прежнего анализатора", note: "документ и пункт уточнить" }
  severity: minor
  check: references.count
  params: { fewer_than: 10, at_least: 5, recommended: 10 }
  message: "Источников {count}, рекомендуется не менее {recommended}."
  expected: "Не менее {recommended} источников."
  found: "Найдено источников: {count}."
  fix: "Добавьте недостающие источники."

- id: REF-BIB-FORMAT
  title: Оформление библиографических записей
  category: format
  source: { doc: "Образцы библиографического описания ВАК Беларуси, 2025", clause: null }
  severity: minor
  check: references.bibliography_format
  params:
    re_entry_number: "^\\s*\\[?\\d+\\]?[.)]?\\s*"
    re_year: "\\b(19|20)\\d{2}\\b"
    re_url: "https?://"
    re_zone_dash: "\\s[–—-]\\s"
    re_access_date: "\\((?:дата\\s+(?:обращения|звароту)|date\\s+of\\s+access)\\s*:"
    re_pages: "(?:[–—-]\\s*(?:[IVXLCDM]+,\\s*)?\\d+\\s*(?:с\\.|p\\.|l\\.|S\\.|л\\.)|[–—-]\\s*(?:С\\.|P\\.|Л\\.)\\s*\\d+)"
    re_local_media: "\\b(?:CD-ROM|DVD-ROM|диск|атлас|карта|л\\.|к\\.)\\b"
    re_official: "\\b(?:конституц|кодекс|закон|декрет|указ|постановлен|приказ|распоряжен|конвенц|договор|соглашен|стандарт|ГОСТ|СТБ|патент|свидетельств|заявк)\\w*"
    re_site_mark: ":\\s*\\[(?:сайт|bibliographic database|database)\\]"
    re_doi: "\\bDOI\\s*:"
    list_limit: 3
    quote_limit: 2
    quote_chars: 90
  message: "Записи в списке источников не по образцу: {suspicious}."
  expected: "По образцу 2025 года: автор и заглавие, сведения об ответственности, зоны через «–», год, объём или страницы; для ссылок — дата обращения."
  found: "{sample}"
  fix: "Сверьте эти записи с образцом и добавьте недостающие элементы."

- id: LST-SIMPLE
  title: Простые перечисления
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: lists.simple_punctuation
  # Элемент со строчной буквы заканчивается «;», последний — «.»; элемент-предложение
  # с прописной буквы заканчивается «.». Вторая часть добавлена к прежней проверке —
  # сверить с пунктом СТП 01-2024 о перечислениях.
  params: { min_items: 3, item_end: ";", last_end: ".", sentence_end: ".", sublist_end: ":", max_examples: 3, quote_chars: 50 }
  message: "Неверные знаки в конце пунктов списка."
  expected: "Пункты со строчной буквы — через «{item_end}», последний — «{last_end}»; пункты-предложения — «{sentence_end}»."
  found: "Пунктов с ошибкой: {violations} из {items} (списков: {lists})."
  fix: "Исправьте знаки в конце пунктов."

- id: LST-NUMBERED
  title: Нумерованные перечисления
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: lists.numbered_punctuation
  params: { min_items: 3, item_end: ".", sublist_end: ":", max_examples: 3, quote_chars: 50 }
  message: "Пункты нумерованного списка без «{item_end}» в конце."
  expected: "Каждый пункт нумерованного списка заканчивается «{item_end}»."
  found: "Пунктов без точки: {violations} из {items} (списков: {lists})."
  fix: "Поставьте точку в конце каждого пункта."

- id: CAP-FIG-REF
  title: Ссылки на рисунки
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: captions.figure_mentions
  params: { quote_chars: 120 }
  message: "Нет ссылок в тексте на рисунки {numbers}."
  expected: "На каждый рисунок есть ссылка в тексте."
  found: "Рисунки без ссылки: {numbers}."
  fix: "Сошлитесь на рисунок в тексте: «см. рисунок N» или «(рисунок N)»."

- id: CAP-TBL-REF
  title: Ссылки на таблицы
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: captions.table_mentions
  params: { quote_chars: 120 }
  message: "Нет ссылок в тексте на таблицы {numbers}."
  expected: "На каждую таблицу есть ссылка в тексте."
  found: "Таблицы без ссылки: {numbers}."
  fix: "Сошлитесь на таблицу в тексте: «см. таблицу N» или «(таблица N)»."
