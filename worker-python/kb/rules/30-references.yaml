# Список использованных источников, перечисления, ссылки на рисунки и таблицы.

- id: REF-COUNT-CRITICAL
  title: Количество источников (минимум)
  category: structure
  source: { doc: "Норма перенесена из прежнего анализатора", note: "документ и пункт уточнить" }
  severity: critical
  blocking: true
  check: references.count
  params: { fewer_than: 5, at_least: 0, recommended: 10 }
  message: "Список источников содержит менее {fewer_than} источников."
  expected: "Должно быть не менее {recommended} источников."
  found: "Найдено: {count}."
  fix: "Добавьте источники и оформите каждый отдельной записью."

- id: REF-COUNT-MIN
  title: Количество источников (рекомендуемое)
  category: structure
  source: { doc: "Норма перенесена из прежнего анализатора", note: "документ и пункт уточнить" }
  severity: minor
  check: references.count
  params: { fewer_than: 10, at_least: 5, recommended: 10 }
  message: "Рекомендуется не менее {recommended} источников."
  expected: "Рекомендуется не менее {recommended} источников."
  found: "Найдено: {count}."
  fix: "Добавьте недостающие источники."

- id: REF-BIB-FORMAT
  title: Оформление библиографических записей
  category: format
  source: { doc: "Образцы библиографического описания ВАК Беларуси, 2025", clause: null }
  severity: minor
  check: references.bibliography_format
  params:
    re_entry_number: "^\\s*\\[?\\d+\\]?[.)]?\\s*"
    re_year: "\\b(19|20)\\d{2}\\b"
    re_url: "https?://"
    re_zone_dash: "\\s[–—-]\\s"
    re_access_date: "\\((?:дата\\s+(?:обращения|звароту)|date\\s+of\\s+access)\\s*:"
    re_pages: "(?:[–—-]\\s*(?:[IVXLCDM]+,\\s*)?\\d+\\s*(?:с\\.|p\\.|l\\.|S\\.|л\\.)|[–—-]\\s*(?:С\\.|P\\.|Л\\.)\\s*\\d+)"
    re_local_media: "\\b(?:CD-ROM|DVD-ROM|диск|атлас|карта|л\\.|к\\.)\\b"
    re_official: "\\b(?:конституц|кодекс|закон|декрет|указ|постановлен|приказ|распоряжен|конвенц|договор|соглашен|стандарт|ГОСТ|СТБ|патент|свидетельств|заявк)\\w*"
    re_site_mark: ":\\s*\\[(?:сайт|bibliographic database|database)\\]"
    re_doi: "\\bDOI\\s*:"
    list_limit: 3
    quote_limit: 2
    quote_chars: 90
  message: "{suspicious} источник(ов) оформлены не по новому образцу."
  expected: "Источники должны соответствовать образцам 2025 года: автор и заглавие, сведения об ответственности, зоны через «–», год, объём или страницы; для URL — дата обращения."
  found: "{sample}"
  fix: "Сверьте подозрительные записи с образцом библиографического описания и добавьте недостающие элементы."

- id: LST-SIMPLE
  title: Простые перечисления
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: lists.simple_punctuation
  # Элемент со строчной буквы заканчивается «;», последний — «.»; элемент-предложение
  # с прописной буквы заканчивается «.». Вторая часть добавлена к прежней проверке —
  # сверить с пунктом СТП 01-2024 о перечислениях.
  params: { min_items: 3, item_end: ";", last_end: ".", sentence_end: ".", sublist_end: ":", max_examples: 3, quote_chars: 50 }
  message: "Нарушено оформление простого списка."
  expected: "Элементы со строчной буквы заканчиваются «{item_end}», последний — «{last_end}»; элементы-предложения с прописной буквы — «{sentence_end}»."
  found: "Списков с нарушениями: {lists}; элементов с неверным знаком в конце: {violations} из {items}."
  fix: "Проверьте знаки препинания в конце пунктов списка."

- id: LST-NUMBERED
  title: Нумерованные перечисления
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: lists.numbered_punctuation
  params: { min_items: 3, item_end: ".", sublist_end: ":", max_examples: 3, quote_chars: 50 }
  message: "Нарушено оформление нумерованного списка."
  expected: "Каждый элемент нумерованного списка заканчивается «{item_end}»."
  found: "Списков с нарушениями: {lists}; элементов без точки: {violations} из {items}."
  fix: "Поставьте точку в конце каждого пункта."

- id: CAP-FIG-REF
  title: Ссылки на рисунки
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: captions.figure_mentions
  params: { quote_chars: 120 }
  message: "Для рисунков {numbers} нет ссылки в тексте."
  expected: "На каждый рисунок должна быть ссылка в тексте работы."
  found: "Не найдены ссылки: {numbers}."
  fix: "Добавьте ссылку «см. рисунок N» или «(рисунок N)» в текст."

- id: CAP-TBL-REF
  title: Ссылки на таблицы
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: captions.table_mentions
  params: { quote_chars: 120 }
  message: "Для таблиц {numbers} нет ссылки в тексте."
  expected: "На каждую таблицу должна быть ссылка в тексте работы."
  found: "Не найдены ссылки: {numbers}."
  fix: "Добавьте ссылку «см. таблицу N» или «(таблица N)» в текст."
