# Содержательные правила. Срабатывают в продукционных правилах CLIPS
# (kb/reasoning/*.clp) над утверждениями, которые извлекла языковая модель и проверили
# символьные шаги (цитата есть в тексте, значение — в словаре). Поле check — имя правила
# в sapsr/content/reasoning.py (CONTENT_RULES).
#
# Блокировать сдачу содержательные правила не могут (решение 5): у них stage: content,
# а схема базы знаний запрещает blocking для таких правил.

- id: CNT-CONSIST-001
  title: Согласованность описания системы
  category: content
  stage: content
  source: { doc: "Требования к системе, 7 семестр", note: "отдельного пункта в методичке нет: согласованность описания системы во всех разделах записки" }
  severity: major
  check: conflict_single
  message: "«{attribute_title}»: в разных разделах описано по-разному."
  expected: "Одинаковое описание во всех разделах."
  found: "{variants}."
  fix: "Приведите описание к одному варианту."
  explanation: "Модель нашла в записке утверждения об одном и том же свойстве системы, правило сравнило их значения по словарю понятий и нашло расхождение. Обе цитаты проверены: они дословно есть в тексте."

- id: CNT-CONSIST-002
  title: Согласованность перечней
  category: content
  stage: content
  source: { doc: "Требования к системе, 7 семестр", note: "отдельного пункта в методичке нет: согласованность описания системы во всех разделах записки" }
  severity: major
  check: conflict_multi
  message: "«{attribute_title}»: перечни в разных разделах не совпадают."
  expected: "Одинаковый перечень во всех разделах."
  found: "{variants}."
  fix: "Приведите описание к одному варианту."
  explanation: "В одном месте записки перечень назван полным, в другом указано значение, которого в нём нет, или полный перечень другой."

- id: CNT-SUPPORT-001
  title: Заявленное описано в проектировании и реализации
  category: content
  stage: content
  source: { doc: "Требования к системе, 7 семестр", clause: "Требования к архитектуре гибридной интеллектуальной системы, с. 59: не допускается имитация гибридности" }
  severity: major
  check: claim_without_support
  message: "«{attribute_title}»: заявлено, но не описано в разделах {required_parts}."
  expected: "То, что заявлено во введении или анализе, описано в проектировании или реализации: на каком шаге работает, что получает и что выдаёт."
  found: "{section_a}: {values_a}; в разделах {required_parts} описания нет."
  fix: "Опишите роль компонента в архитектуре и реализации или уберите это заявление."

