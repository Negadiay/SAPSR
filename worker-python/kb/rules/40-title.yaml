# Титульный лист. Проверки по справочникам ИИС при недоступном справочнике пропускаются
# (pipeline.skipped, причина IIS_UNAVAILABLE), а не дают замечание.

- id: TTL-SPECIALTY
  title: Код специальности в обозначении работы
  category: structure
  source: { doc: "СТП 01-2024", clause: null }
  severity: critical
  blocking: true
  check: title.specialty_code
  params:
    designation_patterns:
      - "БГУИР\\s+КП[3-7]\\s+((?:\\d[\\d\\s\\-]{3,40}\\d))\\s+(\\d{3})\\s+ПЗ\\b"
      - "(\\d-\\d{2}[\\s\\-]\\d{4}-\\d{2}|\\d-\\d{2}[\\s\\-]\\d{2}[\\s\\-]\\d{2})\\s+(\\d{3})\\b"
  message: "Код специальности «{code}» не найден в реестре БГУИР."
  expected: "Код специальности из реестра БГУИР."
  found: "На титульном листе: {code}."
  fix: "Проверьте код специальности на титульном листе."

- id: TTL-CITY-YEAR
  title: Город и год на титульном листе
  category: structure
  source: { doc: "СТП 01-2024", clause: null }
  severity: major
  blocking: true
  check: title.city_year_present
  params: &city_year
    city_year_pattern: "минск[^\\n]*?(\\d{4})|(\\d{4})[^\\n]*?минск"
    year_pattern: "\\b(20\\d{2})\\b"
  message: "На титульном листе нет строки «Минск {current_year}»."
  expected: "Внизу титульного листа — «Минск {current_year}»."
  found: "Строка не найдена."
  fix: "Добавьте «Минск {current_year}» внизу титульного листа."

- id: TTL-YEAR-CURRENT
  title: Год на титульном листе — текущий
  category: structure
  source: { doc: "СТП 01-2024", clause: null }
  severity: major
  blocking: true
  check: title.year_current
  params: *city_year
  message: "На титульном листе указан год {year}, но сейчас {current_year}."
  expected: "Текущий год."
  found: "Год: {year}."
  fix: "Исправьте год на {current_year}."

- id: TTL-YEARS-CONSISTENT
  title: Годы на титульном листе совпадают
  category: structure
  source: { doc: "СТП 01-2024", clause: null }
  severity: major
  blocking: true
  check: title.years_consistent
  params: *city_year
  message: "На титульном листе разные годы."
  expected: "Все годы совпадают с «Минск {year}»."
  found: "Минск — {year}, другие годы — {other_years}."
  fix: "Укажите везде {year}."

# ── заведующий кафедрой ─────────────────────────────────────────────────────

- id: TTL-HEAD-PRESENT
  title: Заведующий кафедрой на титульном листе
  category: structure
  source: { doc: "СТП 01-2024", clause: null }
  severity: major
  blocking: true
  check: title.role_present
  params: &head
    label_pattern: "(?:заведующ(?:ий|ая|его|ей)\\s+кафедр(?:ой|ы)|зав\\.\\s*кафедр(?:ой|ы)?|завкафедр(?:ой|ы)?)"
    role_name: заведующий кафедрой
    role_name_genitive: заведующего кафедрой
    role_title: Заведующий кафедрой
    person_patterns: &people
      - "\\b[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?\\s+[А-ЯЁ][а-яё]+\\s+[А-ЯЁ][а-яё]+"
      - "\\b[А-ЯЁ]\\.\\s*[А-ЯЁ]\\.\\s*[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?"
      - "\\b[А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?\\s+[А-ЯЁ]\\.\\s*[А-ЯЁ]\\."
    lines_below: 2
  message: "На титульном листе не указан {role_name}."
  expected: "На титульном листе указан {role_name}."
  found: "Строки «{role_name}» нет."
  fix: "Добавьте ФИО {role_name_genitive} на титульный лист."

- id: TTL-HEAD-NAME
  title: ФИО заведующего кафедрой
  category: structure
  source: { doc: "СТП 01-2024", clause: null }
  severity: major
  blocking: true
  check: title.role_name_parsed
  params: *head
  message: "Не распознано ФИО {role_name_genitive}."
  expected: "ФИО в виде «Фамилия И.О.» или «И.О. Фамилия»."
  found: "Строка «{role_name}» есть, ФИО не распознано."
  fix: "Проверьте, как записано ФИО {role_name_genitive}."

- id: TTL-HEAD-IIS
  title: Заведующий кафедрой есть в ИИС
  category: structure
  source: { doc: "СТП 01-2024", clause: null }
  severity: major
  blocking: true
  check: title.role_in_directory
  params: *head
  message: "{role_title} «{name}» не найден в ИИС БГУИР."
  expected: "ФИО {role_name_genitive} — как в ИИС БГУИР."
  found: "На титульном листе: {name}."
  fix: "Проверьте ФИО {role_name_genitive} на титульном листе."

