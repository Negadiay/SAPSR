# ── студент ─────────────────────────────────────────────────────────────────

- id: TTL-STUDENT-MATCH
  title: Фамилия студента на титульном листе
  category: integrity
  source: { doc: "SAPSR: защита от сдачи чужой работы", note: "план Котко, К2" }
  severity: minor
  review: true
  check: title.student_matches_registration
  params:
    label_pattern: "(?:студент(?:ка)?|выполнил(?:а)?|исполнитель)"
    person_patterns: *people
    lines_below: 2
  message: "Фамилия на титульном листе не совпадает с фамилией студента."
  expected: "На титульном листе — фамилия студента, который сдаёт работу."
  found: "На титульном листе: {name}."
  fix: "Проверьте, что загружена ваша работа. Если фамилия изменилась, сообщите администратору."

- id: INT-HIDDEN-TEXT
  title: Скрытый текст
  category: integrity
  source: { doc: "SAPSR: защита проверки от внедрения инструкций", note: "план, З9; модель угроз Жерко, п. 17" }
  severity: major
  review: true
  check: integrity.hidden_text
  message: "В документе есть невидимый текст."
  expected: "Весь текст работы видим."
  found: "Скрытых символов: {chars} ({reasons}), страницы {pages}."
  fix: "Удалите скрытый текст (белый, очень мелкий или за краем страницы) и загрузите работу снова."
  explanation: "Скрытый текст не участвует в проверке: он вырезается до анализа содержания. Преподаватель видит это замечание и решает, безобиден ли такой текст."
