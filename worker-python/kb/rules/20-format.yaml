# Шрифт, поля, номера страниц, интервалы. Числа — только здесь, не в коде проверок.
# Внутри шаблонов фигурные скобки LaTeX удваиваются: \geometry{{left=3cm}}.

- id: FMT-FONT-SIZE
  title: Размер основного шрифта
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: fonts.main_size
  # pdfLaTeX сообщает 13,28 пт вместо 14 пт — диапазон расширен, чтобы не было ложных замечаний.
  params: { min_pt: 12, max_pt: 16, share_over_pct: 0, share_upto_pct: 30 }
  message: "Размер основного шрифта вне допустимого диапазона."
  expected: "Допустимый диапазон: {min_pt:g}–{max_pt:g} pt."
  found: "Доминирующий размер: {dominant_pt:g} pt; затронуто {affected} стр. ({pct:.0f}%)."
  fix: "Измените размер основного текста на 14 pt."

- id: FMT-FONT-SIZE-MASS
  title: Размер основного шрифта на большей части страниц
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: major
  blocking: true
  check: fonts.main_size
  params: { min_pt: 12, max_pt: 16, share_over_pct: 30, share_upto_pct: 100 }
  message: "Размер основного шрифта вне допустимого диапазона."
  expected: "Допустимый диапазон: {min_pt:g}–{max_pt:g} pt."
  found: "Доминирующий размер: {dominant_pt:g} pt; затронуто {affected} стр. ({pct:.0f}%)."
  fix: "Измените размер основного текста на 14 pt."

- id: FMT-FONT-FAMILY
  title: Семейство шрифта
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: fonts.family
  params:
    # Сравнение — по подстроке в имени шрифта без префикса подмножества (VOAZZS+SFRM1440 → sfrm1440).
    allowed: [sfrm, sfti, sfit, sfbx, cmr, cmtt, cmmi, lmroman, lmtt, lmsans, timesnewroman, times,
              nimburom, nimburo, arial, helvetica, calibri, georgia, dejavuserif, freserif, ptserif,
              paratype, cmu, ptsans]
    # Если работа сдана в DOCX и сконвертирована, LibreOffice без Times New Roman подставляет
    # метрически совместимый Liberation Serif (решение 3, задача 3.2) — это не ошибка студента.
    docx_substitutes: [liberationserif, liberationsans, tinos, arimo]
    min_share_pct: 0
  message: "Обнаружен нестандартный шрифт."
  expected: "Рекомендуется Times New Roman 14 pt (или Computer Modern для LaTeX)."
  found: "Шрифт «{font}» на {affected} стр. ({pct:.0f}%)."
  fix: "Убедитесь, что шрифт встроен и соответствует требованиям кафедры."

- id: FMT-REF-FONT
  title: Шрифт списка источников
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: fonts.reference_font
  message: "Шрифт списка использованных источников отличается от основного текста."
  expected: "Список источников должен быть оформлен тем же основным шрифтом, что и документ."
  found: "Основной шрифт: «{main_font}»; в списке источников: «{ref_font}»."
  fix: "Приведите список источников к общему стилю документа."

# Поля: край текста — 2-й и 98-й процентили положения символов основного текста.
# Допуск 5,3 мм ≈ 15 пт — как в прежнем анализаторе.
- id: FMT-MARGIN-LEFT
  title: Левое поле
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: margins.side
  params: { side: left, norm_mm: 30, tolerance_mm: 5.3, low_percentile: 2, high_percentile: 98, min_chars: 5 }
  message: "Нарушено левое поле страницы."
  expected: "Левое поле должно быть {norm_mm:g} мм."
  found: "Наименьшее левое поле — {actual_mm:.1f} мм; страниц с нарушением: {affected}."
  fix: "Установите левое поле {norm_mm:g} мм: \\geometry{{left=3cm}} в LaTeX или «Макет → Поля» в Word."

