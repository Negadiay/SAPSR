- id: LAY-PAGE-NUMBERS
  title: Нумерация страниц
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: layout.page_numbers
  params: { start_page: 3, min_coverage: 0.5, min_checkable_pages: 3 }
  message: "Номера страниц не обнаружены."
  expected: "Нумерация должна быть в нижней части страниц начиная со стр. {start_page}."
  found: "Найдено на {found} из {checkable} проверяемых страниц."
  fix: "Проверьте настройки колонтитулов."

- id: LAY-LINE-SPACING
  title: Межстрочный интервал
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: layout.line_spacing
  params:
    min_font_pt: 8
    size_tolerance_pt: 1.5
    min_lines: 8
    gap_min_ratio: 1.1
    gap_max_ratio: 2.5
    min_gaps: 5
    allowed_min_ratio: 1.1
    allowed_max_ratio: 2.2
  message: "Межстрочный интервал (~{ratio:.2f}×) отличается от рекомендованного 1,5."
  expected: "Основной текст должен быть набран с полуторным межстрочным интервалом."
  found: "Медианное расстояние между строками: {gap_pt:.1f} pt при размере шрифта {size_pt:g} pt."
  fix: "Установите \\linespread{{1.5}} в LaTeX или интервал 1,5 в Word."

- id: LAY-PARAGRAPH-INDENT
  title: Абзацный отступ
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: layout.paragraph_indent
  params:
    min_font_pt: 8
    size_tolerance_pt: 1.5
    min_lines: 10
    indent_min_pt: 15
    indent_max_pt: 60
    flush_tolerance_pt: 5
    indented_share_max: 0.03
    flush_share_min: 0.4
    left_edge_pt: 85
  message: "Не обнаружены красные строки (отступ первой строки абзаца)."
  expected: "Первая строка каждого абзаца должна иметь отступ 1,25 см."
  found: "Строк с отступом: {indented} из {total}."
  fix: "Добавьте \\setlength{{\\parindent}}{{1.25cm}} в LaTeX или настройте отступ первой строки в Word."
