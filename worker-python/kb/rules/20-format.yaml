- id: LAY-PAGE-NUMBERS
  title: Нумерация страниц
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: layout.page_numbers
  params: { start_page: 3, min_coverage: 0.5, min_checkable_pages: 3 }
  message: "Не найдены номера страниц."
  expected: "Номер внизу каждой страницы, начиная со {start_page}-й."
  found: "Номер есть на {found} из {checkable} стр."
  fix: "Включите номера страниц в нижнем колонтитуле."

- id: LAY-LINE-SPACING
  title: Межстрочный интервал
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: layout.line_spacing
  params:
    min_font_pt: 8
    size_tolerance_pt: 1.5
    min_lines: 8
    gap_min_ratio: 1.1
    gap_max_ratio: 2.5
    min_gaps: 5
    allowed_min_ratio: 1.1
    allowed_max_ratio: 2.2
  message: "Межстрочный интервал {direction} полуторного."
  expected: "Полуторный интервал в основном тексте."
  found: "Расстояние между строками — {gap_pt:.0f} пт при шрифте {size_pt:g} пт."
  fix: "Установите интервал 1,5. В Word: «Абзац → Междустрочный»; в LaTeX: \\linespread{{1.5}}."

- id: LAY-PARAGRAPH-INDENT
  title: Абзацный отступ
  category: format
  source: { doc: "СТП 01-2024", clause: null }
  severity: minor
  check: layout.paragraph_indent
  params:
    min_font_pt: 8
    size_tolerance_pt: 1.5
    min_lines: 10
    indent_min_pt: 15
    indent_max_pt: 60
    flush_tolerance_pt: 5
    indented_share_max: 0.03
    flush_share_min: 0.4
    left_edge_pt: 85
  message: "Нет абзацного отступа."
  expected: "Первая строка абзаца — с отступом 1,25 см."
  found: "Отступ есть у {indented} строк из {total}."
  fix: "Задайте отступ первой строки 1,25 см. В Word: «Абзац → Первая строка»; в LaTeX: \\setlength{{\\parindent}}{{1.25cm}}."
