# 7-й семестр: базовые правила оформления + требования методички «Требования к системе»
# к гибридной системе. Какие требования проверяются на каком этапе опроцентовки —
# поле stages у требования (kb/requirements/sem7.yaml), поэтому отдельные файлы на этапы
# не нужны; если параметры оформления для этапа будут отличаться, добавить
# sem7_stage<N>.yaml с extends: sem7 и match по этапу.
id: sem7
title: 7-й семестр — курсовой проект по гибридной интеллектуальной системе
extends: base
match:
  semesters: [7]

rules:
  include: all
  exclude: ["NEURAL-*"]

content:
  requirement_sets: [sem7]
