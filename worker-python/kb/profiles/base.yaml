# Базовый профиль: все правила оформления и проверка согласованности содержания.
# Применяется, если в задании не указаны вид работы, семестр и этап (отчёт получает
# предупреждение DEFAULT_PROFILE), и служит основой остальных профилей.
id: base
title: Базовые требования к оформлению

rules:
  include: all
  # Требования семестра включаются профилем семестра.
  exclude: ["REQ-*", "NEURAL-*"]

content:
  enabled: true
  # Части записки, из которых модель извлекает утверждения (порядок — приоритет при нехватке бюджета).
  sections:
    - part.intro
    - part.requirements
    - part.architecture
    - part.implementation
    - part.analysis
    - part.testing
    - part.conclusion
  requirement_sets: []
  # Фрагмент для одного вызова модели и общий бюджет на документ, символов.
  # 6000 символов русского текста ≈ 2–2,5 тыс. токенов.
  fragment_max_chars: 6000
  max_chars_total: 60000
  max_claims_per_fragment: 20
  # Цитата засчитывается, если нечёткое совпадение с текстом блока не ниже (rapidfuzz, 0–100).
  quote_min_score: 90
  # Цитаты короче — не доказательство (короткая строка находится где угодно).
  quote_min_chars: 12
  # Уверенность утверждения, значение которого не нашлось в словаре понятий.
  raw_value_confidence: 0.7
  # Замечание с уверенностью ниже — «требует проверки преподавателем».
  review_threshold: 0.75
  # Требования семестра: сколько фрагментов-кандидатов отдавать модели и минимальная оценка BM25.
  requirement_candidates: 4
  requirement_min_bm25: 0.5
