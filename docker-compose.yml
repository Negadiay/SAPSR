services:
  postgres-db:
    image: postgres:16-alpine
    container_name: sapsr-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sapsr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажи POSTGRES_PASSWORD в .env}
      POSTGRES_DB: sapsr_db
    # Только с этого компьютера: снаружи база не видна. Сервисы внутри Compose ходят по имени postgres-db.
    ports:
      - "127.0.0.1:5433:5432"
    # Схему создаёт бэкенд миграциями Flyway (backend-java/src/main/resources/db/migration).
    # Тестовые данные для разработки — свой dev-seed.sql (не в git, образец — dev-seed.example.sql), загружается вручную.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sapsr_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sapsr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rmq_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Укажи RABBITMQ_PASSWORD в .env}
    # Очередь и панель управления — только с этого компьютера.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  worker:
    build: ./worker-python
    container_name: sapsr-worker
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-rmq_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Укажи RABBITMQ_PASSWORD в .env}
      # Файлы работ по ключу storage_key (queue-v2.md, раздел 3).
      SAPSR_STORAGE_ROOT: /app/storage
      # 2 — ход проверки и результат в две фазы: оформление сразу, содержание вторым сообщением (задача 5.2).
      # Бэкенд принимает и 1 — результат одним сообщением; это откат одной строкой в .env.
      SAPSR_QUEUE_PROTOCOL: ${SAPSR_QUEUE_PROTOCOL:-2}
      # Ollama на ноутбуке (решение 8); без неё проверяется только оформление.
      SAPSR_LLM_BASE_URL: ${SAPSR_LLM_BASE_URL:-http://host.docker.internal:11434}
      SAPSR_LLM_MODEL: ${SAPSR_LLM_MODEL:-qwen3.5:4b}
      # live — настоящая модель; replay — записанные ответы модели из test-fixtures/llm-replay, без Ollama:
      # запасной показ, если модель на машине не поднимется (README, «Показ без модели»).
      SAPSR_LLM_MODE: ${SAPSR_LLM_MODE:-live}
      SAPSR_LLM_REPLAY_DIR: /app/llm-replay
    # На Docker Desktop имя host.docker.internal есть и так; строка нужна для Docker в Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/storage
      - ./test-fixtures/llm-replay:/app/llm-replay:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  backend:
    build: ./backend-java
    container_name: sapsr-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/sapsr_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sapsr_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Укажи POSTGRES_PASSWORD в .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-rmq_user}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Укажи RABBITMQ_PASSWORD в .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Укажи TELEGRAM_BOT_TOKEN в файле .env}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-YOUR_GMAIL@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-YOUR_APP_PASSWORD}
      BOT_WEBAPP_URL: https://${NGROK_DOMAIN:?Укажи NGROK_DOMAIN в .env}
    ports:
      - "8080:8080"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend-webapp
    container_name: sapsr-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: sapsr-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Укажи NGROK_AUTHTOKEN в .env}
    command: http --url=${NGROK_DOMAIN} frontend:80
    depends_on:
      - frontend

volumes:
  pgdata:
  storage:
