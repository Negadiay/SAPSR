services:
  postgres-db:
    image: postgres:16-alpine
    container_name: sapsr-postgres
    environment:
      POSTGRES_USER: sapsr_user
      POSTGRES_PASSWORD: sapsr_password
      POSTGRES_DB: sapsr_db
    ports:
      - "5433:5432"
    # Схему создаёт бэкенд миграциями Flyway (backend-java/src/main/resources/db/migration).
    # Тестовые данные для разработки — свой dev-seed.sql (не в git, образец — dev-seed.example.sql), загружается вручную.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapsr_user -d sapsr_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sapsr-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rmq_user
      RABBITMQ_DEFAULT_PASS: rmq_password
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  worker:
    build: ./worker-python
    container_name: sapsr-worker
    restart: unless-stopped
    environment:
      RABBITMQ_HOST: rabbitmq
      # Файлы работ по ключу storage_key (queue-v2.md, раздел 3).
      SAPSR_STORAGE_ROOT: /app/storage
      # 1 — результат одним сообщением, как сейчас ждёт бэкенд; 2 — после приёма фаз (задача 5.2).
      SAPSR_QUEUE_PROTOCOL: ${SAPSR_QUEUE_PROTOCOL:-1}
      # Ollama на ноутбуке (вариант «на хосте» из задачи 8.1); без неё проверяется только оформление.
      SAPSR_LLM_BASE_URL: ${SAPSR_LLM_BASE_URL:-http://host.docker.internal:11434}
      SAPSR_LLM_MODEL: ${SAPSR_LLM_MODEL:-qwen3.5:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/app/storage
    depends_on:
      rabbitmq:
        condition: service_healthy

  backend:
    build: ./backend-java
    container_name: sapsr-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/sapsr_db
      SPRING_RABBITMQ_HOST: rabbitmq
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Укажи TELEGRAM_BOT_TOKEN в файле .env}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-YOUR_GMAIL@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-YOUR_APP_PASSWORD}
      BOT_WEBAPP_URL: https://${NGROK_DOMAIN:?Укажи NGROK_DOMAIN в .env}
    ports:
      - "8080:8080"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./frontend-webapp
    container_name: sapsr-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: sapsr-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Укажи NGROK_AUTHTOKEN в .env}
    command: http --url=${NGROK_DOMAIN} frontend:80
    depends_on:
      - frontend

volumes:
  pgdata:
  storage:
